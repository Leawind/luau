name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/native/dist
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    # The glibc of the build environment becomes the floor of the produced library, so the
    # Linux natives are built in the manylinux 2.28 image instead of on the runner.
    # verifyUniversalJar fails the release when the floor is exceeded again.
    container: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use the gcc-toolset C++ compiler
        run: echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/native/dist
          if-no-files-found: error

  universal:
    name: Verify universal JAR
    needs: [build, build-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check formatting
        uses: dprint/check@v2
        with:
          dprint-version: 0.64.3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check C++ formatting
        run: |
          pip install clang-format==23.1.5
          ./gradlew clangFormatCheck -PclangFormatPath="$(command -v clang-format)"

      - uses: actions/download-artifact@v4
        with:
          path: prebuilt-natives

      - name: Assemble and verify universal JAR
        run: ./gradlew verifyUniversalJar -PprebuiltNativesDir=prebuilt-natives
