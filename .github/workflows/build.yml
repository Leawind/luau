name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/native/dist
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    # The glibc of the build environment becomes the floor of the produced library, so the
    # Linux natives are built in the manylinux 2.28 image instead of on the runner.
    # verifyUniversalJar fails the release when the floor is exceeded again.
    container: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use the gcc-toolset C++ compiler
        run: echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/native/dist
          if-no-files-found: error

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    # The instrumented library is built and tested only, never shipped, so it stays in the image
    # the Linux natives come from and uses the same gcc-toolset.
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The image carries only the 32-bit archive of the gcc-toolset sanitizer runtime; the
      # 64-bit one, which the link needs, comes from this package.
      - name: Install the gcc-toolset sanitizer runtime
        shell: bash
        run: dnf install -y --setopt=install_weak_deps=False gcc-toolset-14-libubsan-devel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Test with UndefinedBehaviorSanitizer
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          ./gradlew test -PnativeSanitizers=undefined --console=plain 2>&1 | tee ubsan.log

      - name: Fail on an UndefinedBehaviorSanitizer report
        if: always()
        shell: bash
        run: |
          grep -n 'runtime error:' ubsan.log > hits.txt || true
          find build/test-results -name '*.xml' -exec grep -n 'runtime error:' {} + >> hits.txt 2>/dev/null || true
          if [ -s hits.txt ]; then
            cat hits.txt
            echo "::error::UndefinedBehaviorSanitizer reported undefined behavior"
            exit 1
          fi

  asan:
    name: AddressSanitizer
    # Instrumented for diagnosis only: the close-time heap-use-after-free is still being triaged,
    # so this job collects the report without gating the build until the cause is fixed.
    continue-on-error: true
    runs-on: ubuntu-24.04
    # A sanitizer run is far slower than a normal one and the runtime can leave a process waiting
    # on its own report; the cap keeps a broken run from holding a runner for an hour.
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the gcc-toolset AddressSanitizer runtime
        shell: bash
        run: dnf install -y --setopt=install_weak_deps=False gcc-toolset-14-libasan-devel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Test with AddressSanitizer
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          ./gradlew test -PnativeSanitizers=address -PnativeSanitizerRuntime=/lib64/libasan.so.8 --console=plain 2>&1 | tee asan.log

      - name: Collect the AddressSanitizer report
        if: always()
        shell: bash
        run: |
          # The runtime writes each process's report under build/asan.<pid>, the test JVM and the
          # child JVM the hard-limit regression spawns alike.
          cat build/asan.* > asan-report.txt 2>/dev/null || true
          if [ -s asan-report.txt ]; then
            head -c 60000 asan-report.txt
            echo "::warning::AddressSanitizer reported a memory error (see asan-report.txt)"
          else
            echo "no AddressSanitizer report was produced"
          fi

      - name: Upload the AddressSanitizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-log
          path: |
            asan.log
            asan-report.txt
          if-no-files-found: ignore

  universal:
    name: Verify universal JAR
    needs: [build, build-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check formatting
        uses: dprint/check@v2
        with:
          dprint-version: 0.64.3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check C++ formatting
        run: |
          pip install clang-format==23.1.5
          ./gradlew clangFormatCheck -PclangFormatPath="$(command -v clang-format)"

      - uses: actions/download-artifact@v4
        with:
          path: prebuilt-natives

      - name: Assemble and verify universal JAR
        run: ./gradlew verifyUniversalJar -PprebuiltNativesDir=prebuilt-natives
