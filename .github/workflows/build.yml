name: Build

on:
  push:
    branches: [main]
    # Documentation and repository metadata cannot break a build, and the matrix costs a full
    # five-platform run, so these do not trigger it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
      - ".git-blame-ignore-revs"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
      - ".git-blame-ignore-revs"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Compute the native source fingerprint
        id: native_fingerprint
        shell: bash
        run: |
          ./gradlew :core:writeNativeFingerprint --quiet
          fingerprint="$(sed -n 's/^fingerprint=//p' core/build/native/fingerprint.properties)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      # A restored build directory makes Ninja skip the compilation entirely.
      - name: Restore the native build
        uses: actions/cache@v6
        with:
          path: core/build/native
          key: native-${{ matrix.platform }}-${{ matrix.os }}-${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: core/build/native/dist
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    # The glibc of the build environment becomes the floor of the produced library, so the
    # Linux natives are built in the manylinux 2.28 image instead of on the runner.
    # verifyUniversalJar fails the release when the floor is exceeded again.
    container: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use the gcc-toolset C++ compiler
        run: echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Compute the native source fingerprint
        id: native_fingerprint
        shell: bash
        run: |
          ./gradlew :core:writeNativeFingerprint --quiet
          fingerprint="$(sed -n 's/^fingerprint=//p' core/build/native/fingerprint.properties)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      # A restored build directory makes Ninja skip the compilation entirely.
      - name: Restore the native build
        uses: actions/cache@v6
        with:
          path: core/build/native
          key: native-${{ matrix.platform }}-${{ matrix.image }}-${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Build and test
        run: ./gradlew build

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: core/build/native/dist
          if-no-files-found: error

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    # The instrumented library is built and tested only, never shipped, so it stays in the image
    # the Linux natives come from and uses the same gcc-toolset.
    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The image carries only the 32-bit archive of the gcc-toolset sanitizer runtime; the
      # 64-bit one, which the link needs, comes from this package.
      - name: Install the gcc-toolset sanitizer runtime
        shell: bash
        run: dnf install -y --setopt=install_weak_deps=False gcc-toolset-14-libubsan-devel

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Test with UndefinedBehaviorSanitizer
        shell: bash
        run: |
          source /opt/rh/gcc-toolset-14/enable
          ./gradlew :core:test -PnativeSanitizers=undefined --console=plain 2>&1 | tee ubsan.log

      - name: Fail on an UndefinedBehaviorSanitizer report
        if: always()
        shell: bash
        run: |
          grep -n 'runtime error:' ubsan.log > hits.txt || true
          find core/build/test-results -name '*.xml' -exec grep -n 'runtime error:' {} + >> hits.txt 2>/dev/null || true
          if [ -s hits.txt ]; then
            cat hits.txt
            echo "::error::UndefinedBehaviorSanitizer reported undefined behavior"
            exit 1
          fi

  universal:
    name: Verify universal JAR
    needs: [build, build-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check formatting
        uses: dprint/check@v2
        with:
          dprint-version: 0.64.3

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check C++ formatting
        run: |
          pip install clang-format==23.1.5
          ./gradlew :core:clangFormatCheck -PclangFormatPath="$(command -v clang-format)"

      - uses: actions/download-artifact@v8
        with:
          path: prebuilt-natives

      - name: Assemble and verify universal JAR
        run: ./gradlew :mod:verifyUniversalJar -PprebuiltNativesDir=prebuilt-natives
