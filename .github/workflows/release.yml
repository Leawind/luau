name: Release

on:
  push:
    tags:
      - "v*"
  # Builds the whole release without publishing, so the packaging and the publishing actions can be
  # exercised before a tag exists. Only a tag push ever publishes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Compute the native source fingerprint
        id: native_fingerprint
        shell: bash
        run: |
          ./gradlew :core:writeNativeFingerprint --quiet
          fingerprint="$(sed -n 's/^fingerprint=//p' core/build/native/fingerprint.properties)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      # A restored build directory makes Ninja skip the compilation entirely.
      - name: Restore the native build
        uses: actions/cache@v6
        with:
          path: core/build/native
          key: native-${{ matrix.platform }}-${{ matrix.os }}-${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: core/build/native/dist
          if-no-files-found: error

  native-linux:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64

    runs-on: ${{ matrix.os }}
    # The glibc of the build environment becomes the floor of the released library, so the
    # Linux natives are built in the manylinux 2.28 image. verifyUniversalJar rejects a
    # release whose libraries require a newer glibc than luau.glibcFloor.
    container: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Use the gcc-toolset C++ compiler
        run: echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Compute the native source fingerprint
        id: native_fingerprint
        shell: bash
        run: |
          ./gradlew :core:writeNativeFingerprint --quiet
          fingerprint="$(sed -n 's/^fingerprint=//p' core/build/native/fingerprint.properties)"
          echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"

      # A restored build directory makes Ninja skip the compilation entirely.
      - name: Restore the native build
        uses: actions/cache@v6
        with:
          path: core/build/native
          key: native-${{ matrix.platform }}-${{ matrix.image }}-${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: core/build/native/dist
          if-no-files-found: error

  release:
    name: Assemble and publish release
    needs: [native, native-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - uses: actions/download-artifact@v8
        with:
          path: prebuilt-natives

      - name: Verify tag and determine release type
        id: release_metadata
        shell: bash
        run: |
          project_version="$(sed -n 's/^luau.artifactVersion=//p' gradle.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "v${project_version}"
          fi

          if ! [[ "${project_version}" =~ ^(0|[1-9][0-9]*)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported version format: ${project_version}" >&2
            exit 1
          fi

          if [[ "${BASH_REMATCH[1]}" = "0" || "${project_version}" = *-* ]]; then
            version_type=beta
          else
            version_type=release
          fi

          {
            echo "version=${project_version}"
            echo "version_type=${version_type}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build universal release JAR
        run: ./gradlew :mod:verifyUniversalJar :core:sourcesJar :core:javadocJar -PprebuiltNativesDir=prebuilt-natives

      - name: Verify publishing configuration
        if: github.event_name == 'push'
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          test -n "${MODRINTH_PROJECT_ID}" || { echo "Missing repository variable MODRINTH_PROJECT_ID" >&2; exit 1; }
          test -n "${MODRINTH_TOKEN}" || { echo "Missing repository secret MODRINTH_TOKEN" >&2; exit 1; }
          test -n "${CURSEFORGE_PROJECT_ID}" || { echo "Missing repository variable CURSEFORGE_PROJECT_ID" >&2; exit 1; }
          test -n "${CURSEFORGE_TOKEN}" || { echo "Missing repository secret CURSEFORGE_TOKEN" >&2; exit 1; }

      - name: Publish release
        if: github.event_name == 'push'
        uses: Kira-NT/mc-publish@v3.3
        with:
          version: ${{ steps.release_metadata.outputs.version }}
          version-type: ${{ steps.release_metadata.outputs.version_type }}
          loaders: |
            fabric
            forge
            neoforge

          github-generate-changelog: true
          github-prerelease: ${{ steps.release_metadata.outputs.version_type != 'release' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: |
            mod/build/libs/*-universal.jar
            core/build/libs/*-sources.jar
            core/build/libs/*-javadoc.jar

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-files: mod/build/libs/*-universal.jar

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: mod/build/libs/*-universal.jar

  publish:
    name: Publish to Maven Central
    needs: [native, native-linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - uses: actions/download-artifact@v8
        with:
          path: prebuilt-natives

      - name: Verify tag
        shell: bash
        run: |
          project_version="$(sed -n 's/^luau.artifactVersion=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :core:publishAndReleaseToMavenCentral -PprebuiltNativesDir=prebuilt-natives

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-jars
          path: |
            core/build/libs/*-universal.jar
            core/build/libs/*-sources.jar
            core/build/libs/*-javadoc.jar
          if-no-files-found: warn
