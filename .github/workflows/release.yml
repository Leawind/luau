name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: windows-x86_64
            os: windows-2025
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-15

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/native/cmake/out/*luau_jni*
          if-no-files-found: error

  release:
    name: Assemble GitHub release
    needs: native
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          path: prebuilt-natives

      - name: Verify tag version
        shell: bash
        run: |
          project_version="$(sed -n 's/^mod.version=//p' gradle.properties)"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Build universal release JAR
        run: ./gradlew verifyUniversalJar sourcesJar -PprebuiltNativesDir=prebuilt-natives

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/*-universal.jar
            build/libs/*-sources.jar
