org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=false

mod.id=luau
mod.name=luau
mod.author=Leawind
mod.description=A sandboxed Luau runtime for Minecraft mods, wrapping the luau JVM library.
mod.license=MIT
mod.logo=logo.png
mod.homepage=https://github.com/Leawind/luau
mod.issues=https://github.com/Leawind/luau/issues
mod.sources=https://github.com/Leawind/luau
mod.minecraftVersion=1.20.1
mod.packFormat=15

luau.version=0.748
luau.commit=3d91c9d5c280c95bfc4be63aac46012cf861d394
luau.jniAbiVersion=1

# Platforms a release ships, in the order the universal JAR lists them. The platform tests and
# the packaging of the universal JAR both derive from this list.
luau.releasePlatforms=windows-x86_64,linux-x86_64,linux-aarch64,macos-x86_64,macos-aarch64

# Oldest glibc the Linux native libraries are allowed to require. Building on a newer
# baseline silently raises this, and players on older distributions then cannot load the
# library at all, so the release verification enforces it.
luau.glibcFloor=2.28

# What the library says about itself in its POM, and the Maven coordinates. The library is the
# primary artifact and the mod is its packaging; one tag releases both, so the mod takes group
# and version from here too. luau.version above is the upstream Luau version, not this project's.
luau.group=io.github.leawind
luau.artifactVersion=0.1.1
luau.name=luau
luau.description=A sandboxed Luau runtime for the JVM, with the native library bundled for every supported platform.
luau.license=MIT
luau.author=Leawind
luau.homepage=https://github.com/Leawind/luau
luau.issues=https://github.com/Leawind/luau/issues
luau.sources=https://github.com/Leawind/luau
