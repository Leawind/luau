modLoader = "lowcodefml"
loaderVersion = "*"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''${description}'''
logoFile = "${logo}"
logoBlur = false
displayURL = "${homepage}"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies."${id}"]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraftVersion},)"
ordering = "NONE"
side = "BOTH"
